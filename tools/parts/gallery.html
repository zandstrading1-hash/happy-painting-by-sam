    <!-- ============ GALLERY ============ -->
    <section class="work" id="work" aria-labelledby="work-title">
      <div class="wrap">
        <div class="sec-head sec-head--row">
          <div>
            <p class="eyebrow reveal">Recent work</p>

{{=gallery_items}}
        </div>
      </div>
