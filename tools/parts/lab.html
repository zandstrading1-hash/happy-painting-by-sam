    <!-- ============ COLOUR LAB ============ -->
    <section class="lab" id="colour-lab" aria-labelledby="lab-title">
      <div class="wrap lab-grid">
        <div class="lab-copy">
          <p class="eyebrow reveal">Colour Lab</p>
          <h2 id="lab-title" class="reveal split">Can't pick a colour? Take one for a spin.</h2>
          <p class="reveal">Tap a swatch and watch the room get rolled. Your real pick happens with real paint chips, in your own light, at your free estimate.</p>

          <div class="swatches reveal" role="radiogroup" aria-label="Wall colour">
            <button class="sw" role="radio" aria-checked="false" style="--c:#1fa3ad" data-name="Happy Teal">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#2f5f7f" data-name="Detroit River Blue">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#8fa58a" data-name="Ojibway Sage">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#e9b949" data-name="Tecumseh Corn">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#c27a5a" data-name="Kingsville Clay">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#6e4a5e" data-name="Walkerville Plum">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#263a57" data-name="Belle River Navy">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="true" style="--c:#e8dfcd" data-name="Lakeshore Linen">&nbsp;</button>
            <button class="sw" role="radio" aria-checked="false" style="--c:#34373c" data-name="Sam's Charcoal">&nbsp;</button>
          </div>

          <div class="lab-readout reveal" aria-live="polite">
            <span class="lab-chip" style="--c:#e8dfcd"></span>
            <div><b class="lab-name">Lakeshore Linen</b><small class="lab-hex">#E8DFCD</small></div>
            <span class="lab-status">Loading</span>
          </div>

          <a class="btn btn--ink lab-cta reveal" href="#estimate">Love it? Put it on my walls &rarr;</a>
        </div>

        <div class="lab-stage reveal">
          <div class="room-photo" role="img" aria-label="Empty bedroom with white closet doors. The walls change colour when you pick a swatch.">
            <img src="img/bedroom-closet-trim.webp" alt="" width="1200" height="900" />
            <canvas width="1200" height="900"></canvas>
          </div>
          <p class="lab-note">Colours on screen are approximate.</p>
        </div>
      </div>
    </section>
