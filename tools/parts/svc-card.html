          <article class="svc">
            <div class="svc-pic" style="--src: url('{{=src}}')">
              {{=image}}
              <span class="svc-num">{{=num}}</span>
            </div>
            <div class="svc-text">
              <h3 class="svc-title">{{title}}</h3>
              <div class="svc-body">
                <p>{{text}}</p>
                <ul>{{=items}}</ul>
                <a href="{{=link}}" class="svc-link">{{link_text}} &rarr;</a>
              </div>
            </div>
          </article>
